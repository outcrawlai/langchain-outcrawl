[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-outcrawl"
version = "0.1.0"
description = "LangChain tools and a document loader for the Outcrawl search and scrape APIs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Outcrawl", email = "hi@outcrawl.ai" }]
keywords = ["langchain", "outcrawl", "web search", "web scraping", "document loader", "ai agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["langchain-core>=1.0.0,<2.0.0", "httpx>=0.27.0"]

[project.urls]
Homepage = "https://outcrawl.ai"
Source = "https://github.com/outcrawlai/langchain-outcrawl"
Issues = "https://github.com/outcrawlai/langchain-outcrawl/issues"

[dependency-groups]
test = ["pytest", "pytest-asyncio", "respx"]
lint = ["ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["langchain_outcrawl"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "ASYNC"]
ignore = ["ANN401", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
